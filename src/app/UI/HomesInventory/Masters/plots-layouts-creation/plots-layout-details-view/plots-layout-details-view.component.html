<style>
    .Plots {
        padding: 12px;
        margin-bottom: 5px;
        border: 1px solid #111;
        width: 50px;
        height: 50px;
        text-align: center;
        color: #ffffff;
    }
    
    .Booked {
        padding: 5px;
        margin-bottom: 5px;
        /* border: 1px solid #111; */
        width: auto;
        height: 29px;
        text-align: center;
        color: #ffffff;
        background: green;
    }
    
    .Vacant {
        padding: 5px;
        margin-bottom: 5px;

        height: 29px;
        text-align: center;

                </div>
            </div>

            <div class="row ">

                <div class="col-md-4 col-xl-4">
                    <div class="form-group m-0">
                        <label>Layout Name</label>
                        <label class="w-100 text-Content">{{Plotsdetailsdata[0]?.layoutname}}</label>
                    </div>
                </div>
                <div class="col-md-4 col-xl-4">
                    <div class="form-group m-0">
                        <label>Project Type</label>
                        <label class="w-100 text-Content">{{Plotsdetailsdata[0]?.landpurchasetype}}</label>
                    </div>
                </div>
                <div class="col-md-4 col-xl-4">
                    <div class="form-group m-0">
                        <label>Land Name</label>
                        <label class="w-100 text-Content">{{Plotsdetailsdata[0]?.landname}}</label>
                    </div>
                </div>

            </div>
            <div class="row mt-3">
                <div class="col-md-4 col-xl-4">
                    <div class="form-group m-0">
                        <label>No. Of Plots</label>
                        <label class="w-100 text-Content">{{Plotsdetailsdata[0]?.totalnoofplotunits}}</label>
                    </div>
                </div>
            </div>
        </div>
    </div>
