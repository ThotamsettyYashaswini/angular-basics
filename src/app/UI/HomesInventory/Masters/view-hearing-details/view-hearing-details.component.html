
<form>
    <div class="row mt-4">
      <div class="col d-flex flex-wrap align-items-center">
        <a (click)="newContact()"  class="btn btn-b-icon border-0"><img
            src="assets/images/icon-add-white.svg" width="20px" height="20px" class="mr-2" />New</a>
      </div>
    </div>
    
    <div class="row mt-4">
      <div class="col-md-12 col-xl-12">
    
        <kendo-grid [kendoGridBinding]="hearingDetailsData"
                    [pageSize]="pageSize"
                    [skip]="gridState.skip"
                   [pageable]="{buttonCount: 2}"
                   [reorderable]="true"  [sortable]="true" [resizable]="true"
                    [sort]="gridState.sort">
          <ng-template kendoGridToolbarTemplate>
                    <div class="row mb-5">
                      <div class="col-4 pl-0 mt-n1">
                        <input placeholder="Search in all columns..." kendoTextBox class="form-control search-k-cst sb" (input)="onFilter($event.target.value)" />
                      </div>
                      <div class="col-7 pr-0 pl-4 ml-4">
                      <ul class="temp-ul mt-n1 mr-n2  pull-right">
                        <li class="temp-ico ml-2">
                          <a kendoGridPDFCommand><img class="pt-2"  src="assets/images/pdf-icon-blue.svg " title="pdf" width="20px"></a></li>
                       <li class="temp-ico ml-2">
                          <a kendoGridExcelCommand><img class="pt-2" src="assets/images/icon-excel.svg " title="excel" width="20px"></a></li>
                        <!-- <li class="temp-ico ml-2"><a kendoGridExcelCommand><img class="pt-2" src="assets/images/print-icon-blue.svg " title="Excel" width="20px"></a></li> -->
                      </ul>
                  </div>
                  </div>
          
          </ng-template>
          <kendo-grid-column-group title="Hearing Details" [headerClass]="{'kendo-g-center' : true}">
            <!-- <kendo-grid-column field="pFunctionId" title="Select" width="100">
              <ng-template kendoGridCellTemplate let-dataItem >
                  <div id="icon-edit" (click)="hearingEdit(dataItem)"></div>
  
              </ng-template>
          </kendo-grid-column> -->
          
          <kendo-grid-column field="plandname" title="Site Name" [headerClass]="{'kendo-g-center': true}"  class="kendo-center"></kendo-grid-column>
          <kendo-grid-column field="plbcasenumber" title="Case No." [headerClass]="{'kendo-g-center': true}"  class="kendo-center"></kendo-grid-column>
          <kendo-grid-column field="plbCaseHearingDate" title="Hearing Date" [headerClass]="{'kendo-g-center': true}"  class="kendo-center"></kendo-grid-column>
          <!-- <kendo-grid-column field="pCaseHearingType" title="Hearing Type" [headerClass]="{'kendo-g-center': true}"  class="kendo-center"></kendo-grid-column> -->
          <kendo-grid-column field="pOutcome" title="Remarks" [headerClass]="{'kendo-g-center': true}"  class="kendo-center"></kendo-grid-column>
          <kendo-grid-column field="pnexthearingdate" title="Next Hearing" [headerClass]="{'kendo-g-center': true}"  class="kendo-center"></kendo-grid-column>

          <kendo-grid-column field="phearingattendedby" title="Hearing Attended By" [headerClass]="{'kendo-g-center': true}"  class="kendo-center"></kendo-grid-column>

          </kendo-grid-column-group>
          <kendo-grid-pdf fileName="Hearing_Details.pdf" [allPages]="true" paperSize="A4" [repeatHeaders]="true" [scale]="0.61"
                          [landscape]="true">
                          <ng-template kendoGridPDFTemplate>
                              <div class="page-template">
                                 <div class="header bc-2 text-center">
                                  <h5> Hearing Details </h5>
                                 </div>
                               </div>
                             </ng-template>
            <kendo-grid-pdf-margin top="1.5cm" left="1cm" right="1cm" bottom="1cm"></kendo-grid-pdf-margin>

            <kendo-grid-column field="SNo" width="65" title="S.NO." [headerClass]="{'kendo-g-center': true}"
            class="kendo-center">
            <ng-template kendoGridCellTemplate let-dataItem let-rowIndex="rowIndex">
                {{rowIndex+ 1}}
            </ng-template>
        </kendo-grid-column>
           
            <kendo-grid-column field="plandname" title="Site Name" [headerClass]="{'kendo-g-center': true}"  class="kendo-center"></kendo-grid-column>

            <kendo-grid-column field="plbcasenumber" title="Case No." [headerClass]="{'kendo-g-center': true}"  class="kendo-center"></kendo-grid-column>

          <kendo-grid-column field="plbCaseHearingDate" title="Hearing Date" [headerClass]="{'kendo-g-center': true}"  class="kendo-center"></kendo-grid-column>

          <!-- <kendo-grid-column field="pCaseHearingType" title="Hearing Type" [headerClass]="{'kendo-g-center': true}"  class="kendo-center"></kendo-grid-column> -->

          <kendo-grid-column field="pOutcome" title="Remarks" [headerClass]="{'kendo-g-center': true}"  class="kendo-center"></kendo-grid-column>
          
          <kendo-grid-column field="pnexthearingdate" title="Next Hearing" [headerClass]="{'kendo-g-center': true}"  class="kendo-center"></kendo-grid-column>

          <kendo-grid-column field="phearingattendedby" title="Hearing Attended By" [headerClass]="{'kendo-g-center': true}"  class="kendo-center"></kendo-grid-column>

          </kendo-grid-pdf>

          <kendo-grid-excel fileName="Hearing_Details.xlsx" [fetchData]="allData">
              <kendo-excelexport-column-group title="Hearing Details" [headerCellOptions]="headerCells">
                <kendo-excelexport-column field="plandname" title="Site Name" [headerClass]="{'kendo-g-center': true}"  class="kendo-center"></kendo-excelexport-column>

                <kendo-excelexport-column field="plbcasenumber" title="Case No."></kendo-excelexport-column>
          <kendo-excelexport-column field="plbCaseHearingDate" title="Hearing Date"></kendo-excelexport-column>
          <!-- <kendo-excelexport-column field="pCaseHearingType" title="Hearing Type"></kendo-excelexport-column> -->
          <kendo-excelexport-column field="pOutcome" title="Remarks"></kendo-excelexport-column>
          <kendo-excelexport-column field="pnexthearingdate" title="Next Hearing"></kendo-excelexport-column>

          <kendo-excelexport-column field="phearingattendedby" title="Hearing Attended By" [headerClass]="{'kendo-g-center': true}"  class="kendo-center"></kendo-excelexport-column>

                
                   
              </kendo-excelexport-column-group>
          </kendo-grid-excel>
        </kendo-grid>
      </div>
    </div>
    </form>
    <div class="my-container">
        <ng-template #customLoadingTemplate>
          <div class="custom-class">
            <h3>
              Loading...
            </h3>
          
          </div>
        </ng-template>
        <ngx-loading [show]="loading" [config]="{ backdropBorderRadius: '3px' }" [template]="customLoadingTemplate"></ngx-loading>
      
      </div>
